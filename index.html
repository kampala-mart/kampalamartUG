.sell-tag{
  color:var(--orange);
  font-weight:900;
  font-size:12px;
  letter-spacing:1.2px;
  display:flex;
  gap:6px
}

.sell-form{
  background:var(--surface);
  color:var(--ink);
  border-radius:14px;
  padding:20px
}

.sell-form h3{
  margin:0
}

.sell-form p{
  color:var(--muted);
  font-size:13px
}

.trust{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.trust>div{
  background:var(--surface);
  border-radius:14px;
  padding:18px
}

.trust svg{
  color:var(--orange)
}

footer{
  background:var(--navy);
  color:white;
  margin-top:20px
}

.foot-grid{
  max-width:1280px;
  margin:auto;
  padding:28px 20px;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:20px
}

.foot-grid h4{
  margin:0 0 10px
}

.foot-grid p{
  color:#cbd5e1;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere
}

.foot-btn{
  display:block;
  background:none;
  border:0;
  color:#cbd5e1;
  padding:0;
  margin:8px 0;
  font-size:14px;
  text-align:left
}

.pay{
  display:inline-block;
  border:1px solid #334155;
  border-radius:999px;
  padding:6px 10px;
  margin:3px;
  font-size:12px
}

.foot-bottom{
  max-width:1280px;
  margin:auto;
  padding:14px 20px;
  border-top:1px solid #334155;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  color:#cbd5e1;
  font-size:12px
}

.logo.light{
  color:white
}

.overlay{
  position:fixed;
  inset:0;
  background:#10192d99;
  z-index:80;
  display:grid;
  place-items:center;
  padding:16px;
  overflow:auto
}

.modal{
  background:var(--surface);
  border-radius:20px;
  position:relative;
  width:min(820px,100%);
  max-height:92vh;
  overflow:auto;
  display:grid;
  grid-template-columns:1fr 1.1fr
}

.detail-visual{
  min-height:300px;
  display:grid;
  place-items:center;
  padding:20px
}

.detail-copy{
  padding:26px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-width:0
}

.detail-copy h2{
  margin:0;
  overflow-wrap:anywhere
}

.detail-actions{
  display:grid;
  gap:8px;
  margin-top:8px
}

.spec-list{
  border-top:1px solid var(--line);
  padding-top:10px
}

.spec-list>div{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:5px 0;
  font-size:13px
}

.spec-list span{
  color:var(--muted)
}

.pin-modal{
  background:var(--surface);
  border-radius:20px;
  padding:28px;
  position:relative;
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  text-align:left
}

.pin-modal.wide-modal{
  width:min(680px,100%)
}

.pin-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--soft);
  color:var(--orange);
  display:grid;
  place-items:center
}

.pin-modal h2{
  margin:12px 0 4px
}

.pin-modal p{
  color:var(--muted);
  font-size:13px
}

.pin-modal label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-top:12px
}

.pin-modal input,.pin-modal select,.pin-modal textarea,.panel input,.panel select,.panel textarea{
  width:100%;
  margin-top:6px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  padding:11px;
  outline:none;
  background:white;
  color:#172033
}

.pin-modal textarea,.panel textarea{
  resize:vertical
}

.pin-modal em{
  color:#dc2626;
  font-style:normal;
  font-size:11px;
  display:block;
  margin-top:4px
}

.pin-hint{
  background:var(--soft);
  border-radius:9px;
  padding:10px;
  margin-top:10px;
  font-size:13px;
  color:var(--ink)
}

.pin-error{
  color:#dc2626!important
}

.close{
  position:absolute;
  right:12px;
  top:12px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:50%;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  z-index:2
}

.submit{
  width:100%;
  border:0;
  background:var(--orange);
  color:white;
  border-radius:9px;
  padding:13px;
  font-weight:850;
  margin-top:16px
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.check{
  display:flex!important;
  gap:8px;
  align-items:center
}

.check input{
  width:auto!important;
  margin:0!important
}

.fee-box{
  background:var(--soft);
  border:1px solid #BAE6FD;
  border-radius:10px;
  padding:13px;
  margin-top:14px
}

.fee-box p{
  margin:5px 0 0
}

.emoji-grid{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px
}

.emoji-grid button{
  border:1px solid var(--line);
  background:white;
  border-radius:8px;
  width:42px;
  height:42px;
  font-size:20px
}

.emoji-grid button.selected{
  border-color:var(--orange);
  box-shadow:0 0 0 3px #f68b1e22
}

.upload-preview{
  height:190px;
  border-radius:12px;
  background:#f8fafc;
  overflow:hidden;
  margin-top:10px
}

.upload-preview img{
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover
}

.tabs-inline{
  display:flex;
  gap:6px;
  margin:10px 0
}

.tabs-inline button{
  border:1px solid var(--line);
  background:white;
  color:#172033;
  border-radius:999px;
  padding:8px 14px
}

.tabs-inline button.active{
  background:var(--navy);
  color:white
}

.ghost-btn{
  width:100%;
  border:1px solid var(--line);
  background:white;
  color:#172033;
  border-radius:9px;
  padding:12px;
  font-weight:800;
  margin-top:8px
}

.pay-status{
  text-align:center;
  padding:14px
}

.pay-status p{
  color:var(--muted);
  font-size:13px
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #BAE6FD;
  border-top-color:var(--orange);
  border-radius:50%;
  display:block;
  margin:0 auto 10px;
  animation:spin 1s linear infinite
}

.phone-emoji{
  font-size:42px;
  display:block
}

.success-body{
  text-align:center
}

.big-check{
  width:68px;
  height:68px;
  border-radius:50%;
  background:#dcfce7;
  color:#15803d;
  display:grid;
  place-items:center;
  margin:auto;
  font-size:32px
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.admin-shell{
  padding-top:22px
}

.admin-top{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:start;
  flex-wrap:wrap
}

.admin-top h2{
  font-size:clamp(26px,4vw,36px);
  margin:4px 0 2px
}

.admin-top-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.admin-top-actions button,.owner-badge{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:9px;
  padding:9px 12px;
  font-weight:750;
  font-size:13px
}

.owner-badge{
  background:#dcfce7;
  color:#15803d;
  border-color:#bbf7d0
}

.admin-top-actions .logout{
  background:#fef2f2;
  color:#dc2626
}

.admin-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:18px 0
}

.admin-tabs button{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:999px;
  padding:10px 14px;
  font-weight:750;
  white-space:nowrap
}

.admin-tabs button.active{
  background:var(--navy);
  color:white
}

.admin-grid{
  display:grid;
  gap:14px
}

.stat-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.stat-cards>div{
  background:var(--surface);
  border-radius:14px;
  padding:18px
}

.stat-cards span{
  display:flex;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  font-weight:750
}

.stat-cards svg{
  color:var(--orange)
}

.stat-cards b{
  display:block;
  font-size:clamp(22px,3vw,30px);
  margin:9px 0 3px
}

.stat-cards small{
  color:var(--muted);
  font-size:12px
}

.panel{
  background:var(--surface);
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 16px #10192d0a;
  margin-top:14px
}

.panel h3{
  margin:0;
  font-size:17px
}

.panel label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin-top:12px
}

.muted{
  color:var(--muted);
  font-weight:500
}

.order-row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:14px 0;
  border-bottom:1px solid #f1f5f9;
  flex-wrap:wrap
}

.order-row.compact{
  align-items:center
}

.order-row span{
  font-size:12px;
  color:var(--muted)
}

.status{
  display:inline-flex;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap
}

.status.live{
  background:#dcfce7;
  color:#15803d
}

.status.draft{
  background:#fef3c7;
  color:#075985
}

.status.sold{
  background:#dbeafe;
  color:#1d4ed8
}

.status.hidden{
  background:#e2e8f0;
  color:#475569
}

.table-wrap{
  overflow-x:auto
}

.admin-table{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
  font-size:13px
}

.admin-table th{
  text-align:left;
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  padding:10px;
  border-bottom:1px solid var(--line)
}

.admin-table td{
  padding:11px 10px;
  border-bottom:1px solid #f1f5f9
}

.row-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap
}

.row-actions button{
  border:1px solid var(--line);
  background:#f8fafc;
  color:#172033;
  border-radius:7px;
  padding:6px 8px;
  display:flex;
  gap:4px;
  align-items:center;
  font-size:12px
}

.row-actions .danger,.danger{
  color:#dc2626
}

.confirm-box{
  display:flex;
  gap:10px;
  align-items:center;
  background:#fef2f2;
  border:1px solid #fecaca;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  flex-wrap:wrap
}

.confirm-box button{
  border:1px solid var(--line);
  background:white;
  border-radius:7px;
  padding:8px 11px
}

.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  align-items:start
}

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:14px;
  align-items:start
}

.chat-list{
  display:grid;
  gap:8px
}

.chat-list button{
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:12px;
  padding:13px;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:3px
}

.chat-list button.active{
  border-color:var(--orange);
  box-shadow:0 0 0 3px #f68b1e22
}

.chat-list span,.chat-list small{
  color:var(--muted);
  font-size:12px
}

.chat-panel{
  background:var(--surface);
  border-radius:16px;
  padding:18px;
  min-height:340px
}

.chat-head{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  padding-bottom:10px
}

.chat-messages{
  display:grid;
  gap:10px;
  padding:14px 0
}

.chat-msg{
  background:#f8fafc;
  border-radius:12px;
  padding:11px;
  max-width:85%
}

.chat-msg.mine{
  margin-left:auto;
  background:#F0F9FF
}

.chat-msg b{
  font-size:12px
}

.chat-msg p{
  margin:4px 0
}

.chat-msg small{
  color:var(--muted);
  font-size:11px
}

.chat-input{
  display:flex;
  gap:8px
}

.chat-input input{
  flex:1;
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:11px;
  min-width:0
}

.chat-input button,.offer-row button{
  border:0;
  background:var(--orange);
  color:white;
  border-radius:9px;
  padding:11px 13px;
  font-weight:800;
  display:flex;
  gap:6px;
  align-items:center
}

.offer-row{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap
}

.offer-row input{
  border:1px solid #cbd5e1;
  border-radius:9px;
  padding:10px;
  min-width:0
}

.offer-actions{
  display:flex;
  gap:6px;
  margin-top:6px
}

.offer-actions button{
  border:1px solid var(--line);
  background:white;
  border-radius:7px;
  padding:6px 9px
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:var(--navy);
  color:white;
  border-radius:999px;
  padding:12px 16px;
  display:flex;
  gap:8px;
  align-items:center;
  z-index:100;
  font-size:13px;
  max-width:calc(100vw - 32px);
  overflow-wrap:anywhere
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .stat-cards{
    grid-template-columns:repeat(2,1fr)
  }

  .settings-grid,.chat-layout,.sell{
    grid-template-columns:1fr
  }

  .header-inner{
    flex-direction:column;
    align-items:stretch
  }

  .search{
    width:100%
  }

  .hero{
    grid-template-columns:1fr;
    padding:28px 22px
  }

  .foot-grid{
    grid-template-columns:1fr 1fr
  }

  .modal{
    grid-template-columns:1fr
  }

  .detail-visual{
    min-height:220px
  }
}

@media(max-width:580px){
  .grid{
    grid-template-columns:1fr
  }

  .promo-row,.trust{
    grid-template-columns:1fr
  }

  .foot-grid{
    grid-template-columns:1fr
  }

  .two{
    grid-template-columns:1fr
  }

  .hero-card{
    position:static;
    margin-top:12px
  }

  .hero-visual{
    min-height:0;
    display:block
  }

  .hero-emoji{
    font-size:80px
  }

  .stat-cards{
    grid-template-columns:1fr 1fr
  }

  .pin-modal{
    padding:20px 16px
  }

  .header-actions{
    justify-content:space-between
  }

  .chat-msg{
    max-width:100%
  }
}

/* RESPONSIVE SIZE — 1200px desktop, 3-col tablet, 2-col phone, no sideways scroll. */

html,body{
  overflow-x:clip
}

body{
  font-size:16px;
  line-height:1.55
}

img,video{
  max-width:100%;
  height:auto
}

.app{
  overflow-x:clip;
  width:100%
}

button{
  overflow-wrap:anywhere
}

/* Legacy .header-inner / .header-actions no longer used by .site-header. */

.logo small{
  font-size:10px
}

.header-row-1 .search{
  margin:0;
  height:44px
}

.header-row-1 .search button{
  min-height:44px;
  padding:0 20px;
  font-size:14px
}

.login,.sell-btn{
  min-height:44px;
  font-size:14px
}

main{
  max-width:1200px;
  margin:auto;
  padding:20px 24px 32px
}

.shop-head h2{
  font-size:24px;
  line-height:1.2
}

.shop-head{
  align-items:flex-end
}

.controls{
  flex-wrap:wrap
}

.sort{
  font-size:14px
}

.sort input,.sort select{
  font-size:14px
}

.pills{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:16px 0 20px;
  scrollbar-width:thin
}

.pills button{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  padding:10px 18px;
  border-radius:999px;
  white-space:nowrap;
  font-weight:700;
  font-size:14px;
  min-height:44px;
  flex:none
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px
}

.card{
  min-width:0
}

.visual{
  min-height:200px;
  height:200px
}

.visual img{
  width:100%!important;
  height:200px!important
}

.card-body{
  padding:16px;
  gap:9px
}

.cat{
  font-size:13px
}

.name{
  font-size:16px;
  line-height:1.35
}

.price-row b{
  font-size:18px
}

.meta-line{
  font-size:13px;
  line-height:1.45
}

.nego{
  font-size:13px
}

.add{
  min-height:44px;
  font-size:15px;
  padding:12px
}

.empty button{
  min-height:44px
}

.promo-row{
  gap:20px
}

.promo-row b{
  font-size:15px
}

.promo-row p{
  font-size:13px;
  line-height:1.45
}

.trust{
  gap:20px
}

.trust>div{
  padding:20px
}

.trust p{
  font-size:14px;
  line-height:1.5
}

.foot-grid{
  max-width:1200px;
  padding:28px 24px
}

.foot-bottom{
  max-width:1200px;
  padding:14px 24px
}

.role-welcome{
  font-size:14px;
  font-weight:800;
  margin:0 0 12px
}

.role-chooser{
  text-align:left
}

.role-chooser h2{
  font-size:24px
}

.role-chooser p{
  font-size:15px;
  line-height:1.55
}

.role-chooser-options{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  margin-top:18px
}

.role-choice{
  width:100%;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  cursor:pointer
}

.role-choice:hover,.role-choice:focus-visible{
  border-color:var(--orange);
  box-shadow:0 0 0 3px #f68b1e22;
  outline:none
}

.role-choice-icon{
  font-size:30px;
  flex:none
}

.role-choice span:nth-child(2){
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
  flex:1
}

.role-choice b{
  font-size:16px;
  color:#111
}

.role-choice small{
  font-size:14px;
  color:#64748b;
  line-height:1.45
}

.role-choice-arrow{
  font-size:20px;
  color:var(--orange);
  flex:none
}

.submit,.ghost-btn{
  min-height:44px;
  font-size:15px
}

.pin-modal input,.pin-modal select,.pin-modal textarea,.panel input,.panel select,.panel textarea{
  font-size:15px;
  min-height:44px
}

.pin-modal label,.panel label{
  font-size:14px
}

.pin-modal p{
  font-size:14px;
  line-height:1.55
}

@media(max-width:1024px){
  .header-inner{
    padding:13px 20px;
    gap:14px
  }

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px
  }

  .foot-grid{
    grid-template-columns:1fr 1fr
  }

  .sell{
    grid-template-columns:1fr
  }

  .support-cards{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:767px){
  button{
    min-height:44px
  }

  input,select,textarea{
    min-height:44px;
    font-size:15px
  }

  .header-inner{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:12px;
    padding:12px 16px;
    align-items:stretch
  }

  .header-brand-row{
    grid-column:1;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px
  }

  .logo{
    font-size:20px
  }

  .header-role{
    flex-wrap:wrap;

/* Header stays sticky at 64px — never fixed, never overlapping the banner. */

.site-header{
  position:sticky!important;
  top:var(--safe-area-inset-top)!important;
  left:auto;
  right:auto;
  z-index:100!important
}

.app{
  padding-top:var(--safe-area-inset-top)
}

.overlay{
  z-index:10000!important
}

.profile-dropdown{
  position:fixed;
  top:calc(var(--safe-area-inset-top) + 68px);
  right:12px;
  z-index:10001;
  width:min(320px,calc(100vw - 24px));
  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:16px;
  box-shadow:0 20px 50px rgba(16,25,45,.22);
  padding:10px;
  text-align:left
}

.profile-dropdown .pd-head{
  display:flex;
  gap:10px;
  align-items:center;
  padding:8px;
  border-bottom:1px solid #eef2f7
}

.profile-dropdown .pd-head b{
  display:block;
  overflow-wrap:anywhere
}

.profile-dropdown .pd-head small{
  color:#64748b
}

.pd-avatar{
  width:44px;
  height:44px;
  flex:none;
  border-radius:50%;
  background:#F68B1E;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px
}

.pd-nav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:10px 0
}

.pd-nav button{
  border:1px solid #e7eaf0;
  background:#F0F9FF;
  border-radius:10px;
  padding:10px;
  font-weight:800;
  color:#111
}

.pd-list{
  display:grid;
  gap:6px
}

.pd-list button{
  width:100%;
  text-align:left;
  border:0;
  background:#fff;
  border-radius:10px;
  padding:12px;
  font-weight:750;
  display:flex;
  justify-content:space-between;
  color:#111
}

.pd-list button:hover{
  background:#F0F9FF
}

.pd-list button.danger{
  color:#dc2626
}

.profile-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0
}

.profile-tabs button{
  border:1px solid #e7eaf0;
  background:#fff;
  border-radius:999px;
  padding:10px 15px;
  font-weight:800
}

.profile-tabs button.active{
  background:#111;
  color:#fff
}

.how-works{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;

}

  background:#fff;
  border:1px solid #e7eaf0;
  border-radius:16px;

  margin:10px 0 0;
  padding-left:20px;
  line-height:1.6
}

  background:linear-gradient(135deg,#5AB8FF,#5AB8FF);
  color:#fff;
  border-radius:16px;
  padding:20px;
  overflow:hidden

  color:#fff!important;
  margin:0 0 6px
}

.earn-card p{
  color:#fff!important
}

  align-items:center;
  gap:10px;

  margin:14px 0
}

  color:#111;
  border-radius:10px;
  padding:8px 12px;

  border-radius:14px;

  margin:0 0 10px

.shop-sidebar label{
  display:block;

.shop-sidebar input,.shop-sidebar select{

.jiji-gallery .big-emoji{
  font-size:150px
}

.jiji-arrow.prev{

.jiji-arrow.next{
  right:10px

.jiji-thumbs button{

.jiji-dots span.active{
  background:#F68B1E

  line-height:1.15;

  font-size:clamp(26px,3.5vw,34px);
  font-weight:900;

.jiji-meta{

.jiji-desc{
  line-height:1.65;

}

  background:#fff;
  border-radius:10px;
  padding:11px 14px;

  background:#F68B1E!important;

==="month"?n.monthDays:n.yearDays,Ni=(n)=>n==="week"?"1 Week":n==="month"?"1 Month":"1 Year",Rp={about:{title:"About Kampala Mart",body:`Kampala Mart is Uganda's everyday marketplace — built for real sellers and real buyers in Kampala and across Uganda.
Sellers list phones, groceries, fashion, beauty, home goods, agriculture, vehicles, property and more, with clear prices and honest photos.
Buyers search, compare, chat or call the seller, agree pickup, and pay the seller directly.
OUR MISSION: Make it easy and safe for anyone in Uganda to sell what they have and buy what they need, without middlemen or hidden fees.
HOW IT WORKS — 3 STEPS: 1) Register free with your +256 number. 2) Upload your product with photos, price and details. 3) Buyers chat or call you, you agree pickup, and you get paid.
WHY TRUST US: Verified sellers — sellers can earn a Verified ID badge. Support Team — real people review payments and help in Support / Help. Clear pricing — the listing fee and Boost fee are shown before you pay.
SAFETY TIPS: Meet in a public place. Check the product before you pay. Never send money before you have seen the product. Keep your chat inside Kampala Mart when you can. If something feels wrong, stop and contact the Support Team.
Kampala Mart starts in Uganda — Kampala first — with real sellers, clear prices and safe pickup across Uganda.`},hiring:{title:"We are hiring!",body:`We are growing the Kampala Mart support team in Kampala, Uganda.
We are looking for friendly, honest people who can help sellers, check payments and answer support messages.
ROLES: Support assistant — replies to buyers and sellers in Support / Help. Payment checker — checks Transaction IDs and proof of payment. Seller helper — helps new sellers upload good photos and clear titles.
WHAT YOU NEED: A phone with WhatsApp, good English and Luganda, and honesty with money and messages.
WHAT YOU GET: Flexible hours, clear daily tasks, and pay agreed with the owner before you start.
HOW TO APPLY: Send your name, phone, location and experience through Support / Help, or chat with the owner.
The owner reviews every message in this visit and replies in Support > My Messages when you are logged in.
Only send your name, phone and experience — never send passwords or PINs.`},terms:{title:"Terms & Conditions",body:`Welcome to Kampala Mart. By using this site you agree to these terms.
1) ONLY REAL PRODUCTS: List only products you truly have, with honest prices and honest photos.
2) SELLERS ARE RESPONSIBLE: Sellers are responsible for their products, pickup and delivery. Kampala Mart does not deliver or hold your money.
3) BUYERS MUST CHECK: Buyers must confirm a product before paying the seller. Meet in a public place and check the product first.
4) NO FAKE LISTINGS: No copied photos, no fake prices, no spam, and no products that break Ugandan law.
5) THE OWNER MAY REMOVE: The owner may hide, reject or remove any listing that breaks these rules, without a refund of a fee already used.
6) PAYMENTS: Listing fees and Boost fees are paid to Kampala Mart. Buyer-to-seller payments are between buyer and seller.
7) ACCOUNTS: Keep your password safe. You are responsible for what happens on your account.
8) CHANGES: The owner may update these terms. The current terms on this page always apply.`},privacy:{title:"Privacy Policy",body:`Kampala Mart respects your privacy. This policy explains what we show and why.
WHAT WE SHOW: We show your name, phone and location only so buyers can reach you about your listing.
WHAT WE DO NOT DO: We do not sell your details. We do not share your password or PIN with anyone.
WHAT WE COLLECT IN THIS VISIT: Your account details, listings, chats and support messages live only in memory for this visit.
CHATS: Your chat messages are shown only to the buyer and seller in that chat, plus the owner for support.
PAYMENTS: We ask for your name, Transaction ID or proof of payment only to confirm your listing fee or Boost fee.
YOUR CHOICES: You can edit your profile, hide or delete your listings, and delete your account in Settings.
QUESTIONS: Contact the Support Team through Support / Help or support@kampalamart.com.
If you see your photo or details used without permission, report it through Support / Help.`},billing:{title:"Billing Policy",body:`LISTING FEE (PAID mode): A seller pays a listing fee before a product goes live. The fee depends on the product price and is shown before payment. In FREE mode there is no listing fee.
UPGRADE / BOOST FEE: Boost is optional and separate from the listing fee. You choose 1 Week, 1 Month or 1 Year. The Boost fee is shown in the Boost window. Current Boost prices: Week UGX 10,000, Month UGX 30,000, Year UGX 300,000 — the owner can change them.
HOW BOOST WORKS: 1) Open Upgrade / Boost on your product. 2) Choose Week, Month or Year. 3) Pay with MTN, Airtel or Bank. 4) Send your Transaction ID OR upload proof of payment. 5) The Support Team checks it and approves it. Your product is then boosted until the period ends.
WHEN BOOST IS LIVE: Your product moves to the front of the grid with a BOOSTED / Sponsored label and is seen first for the period you paid.
PAYMENT: In the current mode you send proof or a Transaction ID and the Support Team approves it. When the owner connects the API, verification can switch to automatic.
REFUNDS: No refund after a Boost starts. If a Boost has not started and was not approved, ask the Support Team in Support / Help.
NO DELIVERY FEE: No delivery fee is charged by Kampala Mart. Buyer and seller arrange pickup or delivery themselves.
PAYMENT DETAILS: MTN Merchant ID 71149179, Airtel Merchant ID 7311025, Opportunity Bank 1325508922717.`},candidate:{title:"Candidate Privacy",body:`If you apply for a role, only send your name, phone and experience.
We use it only to consider your application and to contact you about it.
We do not share your application with other sellers or buyers.
We do not ask for your password, PIN, or bank PIN at any time.
You can ask us to delete your application by messaging the Support Team.
We reply in Support > My Messages when you are logged in.
Thank you for wanting to grow Kampala Mart with us.`},cookie:{title:"Cookie Policy",body:`This preview does not use tracking cookies.
Your session, listings and messages live only in memory for this visit.
We do not track you across other websites.
We do not sell browsing data.
If a future version adds cookies, this page will explain exactly what they do.
You can close the site at any time — nothing is saved after refresh in this preview.
Questions? Contact the Support Team through Support / Help.`},copyright:{title:"Copyright Policy",body:`Do not upload photos or text that belong to someone else.
Use only photos you took yourself, or photos the owner of the product gave you permission to use.
Do not copy another seller's title, description or photos word-for-word.
Do not use brand logos to pretend you are that brand.
If a listing uses your work without permission, report it through Support / Help.
Tell us the listing name, your name, and proof that the work is yours.
The owner can hide or remove the listing while it is checked.
Repeat offenders may have their account blocked.`},safety:{title:"Safety tips",body:`1) MEET IN PUBLIC: Meet in a busy, public place in the daytime — a shop, market or police post area.
2) CHECK BEFORE YOU PAY: Check the product, turn it on, and test it before you pay the seller.
3) NEVER SEND MONEY FIRST: Never send money before you have seen the product.
4) KEEP CHAT INSIDE: Keep your chat inside Kampala Mart when you can, so the Support Team can help if there is a problem.
5) TRUST YOUR FEELING: If a price is too good to be true, or the seller rushes you, stop and walk away.
6) PROTECT YOUR PIN: Never share your MTN PIN, Airtel PIN, password or bank PIN with a seller or buyer.
7) REPORT: If something feels wrong, stop and contact the Support Team through Support / Help.
8) BRING A FRIEND: If you can, go with a friend when you meet a new seller.`},contact:{title:"Contact Us",body:`We are here to help — Kampala Mart, Uganda.
Email: support@kampalamart.com
Phone: use the Support / Help page or chat with the owner.
SUPPORT HOURS: We reply in Support > My Messages when you are logged in.
WHEN YOU WRITE, TELL US: Your name, your phone, the product name, and what happened.
PAYMENT HELP: Send your name, Transaction ID or proof, amount sent, and product name.
SELLER HELP: Send your product name and a clear photo of the problem.
We do not ask for your password or PIN. Never share them with anyone.
Thank you for buying and selling on Kampala Mart.`},faq:{title:"FAQ",body:`How do I upload? Login, tap Sell, add title, price, photo and details, then follow the fee or free flow.
How much is the listing fee? The fee depends on your product price and is shown before you pay. Example: up to UGX 20,000 costs UGX 2,000; up to UGX 200,000 costs UGX 8,000.
How do I pay? MTN Merchant ID 71149179, Airtel Merchant ID 7311025, or Opportunity Bank 1325508922717. Send proof OR a Transaction ID.
How do I boost? Open Upgrade / Boost on your product, choose Week / Month / Year, pay, and send proof or a Transaction ID. The Support Team approves it.
How do I contact a seller? Open a product, then use Chat Seller, Show Seller Number, or Call Seller.
How long does approval take? The Support Team checks payments in this visit. You will see Under Review until it is approved.
Is delivery included? No. Buyer and seller arrange pickup or delivery themselves. No delivery fee is charged.
How do I stay safe? Meet in public, check before you pay, and never send money before you see the product.`},apps:{title:"Our apps — Coming soon",body:`The Kampala Mart app for App Store and Google Play is coming soon.

Check back soon, or contact the Support Team for updates.

Kampala Mart — Uganda's everyday marketplace.`},africa:{title:"Kampala Mart Africa",body:`Kampala Mart starts in Uganda — Kampala first.
Our focus is real sellers, clear prices and safe pickup across Uganda.
We serve Kampala, Wakiso, Mukono, Jinja, Mbarara, Gulu, Mbale, Entebbe and Ntinda.
Sellers list phones, groceries, fashion, beauty, home goods, agriculture and more.
Buyers chat or call the seller, agree pickup, and pay the seller directly.
When Uganda is strong, we will grow to our neighbours — step by step.
Thank you for building Kampala Mart with us.`},popular:{title:"Popular searches",body:`Popular searches: Phones, Groceries, Fashion, Electronics, Agriculture, Home & Furniture, Vehicles, Property.

Filter by location: Kampala, Ntinda, Kawempe, Wakiso, Jinja, Mbarara.
Sort by Price: Low to High or High to Low to compare sellers.
Save a product with the heart button to find it again.
New products appear after the Support Team approves the listing fee.`},supportEmail:{title:"support@kampalamart.com",body:`Write to support@kampalamart.com with your name, phone and product name.
Or use Support / Help on this site — the owner sees your message in Support Messages.
For payment help, include your Transaction ID or proof, amount sent, and product name.
For product help, include the product name and a clear description of the problem.
We reply in Support > My Messages when you are logged in.
We never ask for your password or PIN. Never share them.
Thank you for contacting Kampala Mart.`}},My=(n)=>{if(!n?.createdAt)return 0;let t=Date.parse(n.createdAt);if(!t||t>Date.now())return 0;return Math.floor((Date.now()-t)/31536000000)},Pi=(n)=>{let t=My(n);if(t<1)return"";if(t===1)return"1 year on Kampala Mart";return`${t} years on Kampala Mart`},_l=(n)=>{let t=Math.round(n);return"★★★★★".split("").map((r,i)=>i<t?"★":"☆").join("")},Ar=(n)=>{let t=(n.photos||[]).map((r)=>r.trim()).filter(Boolean);if(t.length)return t;return n.photoUrl?[n.photoUrl]:[]},Iy=[{q:"How do I upload a product?",a:"Login, tap Sell / Upload Product, add your title, price, photo and details, then pay the listing fee with MTN MoMo. When payment is confirmed, the product goes live."},{q:"How much is the listing fee?",a:"The fee depends on your product price and is shown automatically before you pay. For example, a product up to UGX 20,000 costs UGX 2,000 and a product up to UGX 200,000 costs UGX 8,000. Small fee to keep marketplace safe. There is no delivery fee."},{q:"How do I pay?",a:"In Manual mode, send the listing fee to the Kampala Mart Merchant ID shown on the payment screen — MTN Merchant ID 71149179 or Airtel Merchant ID 7311025 — from any number, then send your name, Transaction ID and amount sent for approval. In Automatic mode, enter your MTN or Airtel number and approve the prompt on your phone."},{q:"How long does verification take?",a:"You will see Waiting for MTN PIN... or Waiting for Airtel PIN... then the payment is checked. When it shows Paid, the product goes live. If payment was not received, you can try again."},{q:"How do I contact a seller?",a:"Open a product, then use Call Seller or WhatsApp Seller. You can ask questions and agree pickup directly with the seller."},{q:"How do I contact the support team?",a:"Use the Support page. Send a message with the form below, or tap Chat with Support Team. Our support team can reply here, and you will see the reply under My Messages when logged in."}],eh=["All","Phones","Computers","Fa <script id="km-banner-rotate">
(function(){
  window.__kmDefaultBanners = window.__kmDefaultBanners || [];
  var DB_NAME = "km_banners_db", STORE = "banners", idbList = [];
  function openDB(cb){
    try{
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(){ try{ req.result.createObjectStore(STORE, {keyPath:"id"}); }catch(e){} };
      req.onsuccess = function(){ cb(req.result); };
      req.onerror = function(){ cb(null); };
    }catch(e){ cb(null); }
  }
  function loadIDB(){
    openDB(function(db){
      if(!db) return;
      try{
        var tx = db.transaction(STORE, "readonly");
        var rq = tx.objectStore(STORE).get("list");
        rq.onsuccess = function(){ try{ var v = rq.result && rq.result.items; if(Array.isArray(v)){ idbList = v.filter(function(u){return typeof u==="string"&&u;}); idbList.forEach(function(u){ if(window.__kmBannerList.indexOf(u)===-1) window.__kmBannerList.push(u); }); } }catch(e){} };
      }catch(e){}
    });
  }
  loadIDB();
  window.__kmSaveBannerToDB = function(url){
    try{ window.__kmBannerList = window.__kmBannerList || []; if(typeof url==="string"&&url&&window.__kmBannerList.indexOf(url)===-1) window.__kmBannerList.push(url); }catch(e){}
    openDB(function(db){
      if(!db) return;
      try{
        var tx = db.transaction(STORE, "readwrite");
        var st = tx.objectStore(STORE);
        var g = st.get("list");
        g.onsuccess = function(){
          var items = (g.result && g.result.items) || [];
          if(items.indexOf(url) === -1) items.push(url);
          idbList = items.slice();
          try{ st.put({id:"list", items: items}); }catch(e){}
        };
      }catch(e){}
    });
  };
  window.__kmClearBannersDB = function(){
    idbList = [];
    try{ window.__kmBannerList = []; window.__kmBannerIndex = 0; }catch(e){}
    openDB(function(db){ if(!db) return; try{ var tx = db.transaction(STORE, "readwrite"); tx.objectStore(STORE).delete("list"); }catch(e){} });
  };
  window.__kmBannerList = window.__kmBannerList || [];
  window.__kmBannerIndex = window.__kmBannerIndex || 0;
  window.__kmGetBannerList = function(){
    var out = [];
    (window.__kmBannerList||[]).forEach(function(u){ if(typeof u==="string"&&u&&out.indexOf(u)===-1) out.push(u); });
    try{ var saved = JSON.parse(localStorage.getItem("km_banners")||"[]"); saved.forEach(function(u){ if(typeof u==="string"&&u&&out.indexOf(u)===-1) out.push(u); }); }catch(e){}
    idbList.forEach(function(u){ if(out.indexOf(u)===-1) out.push(u); });
    if(out.length>=2) return out;
    if(out.length===1) return [out[0]].concat(window.__kmDefaultBanners);
    return window.__kmDefaultBanners;
  };
})();
</script>

<script id="km-v40-js">
(function(){
  // V40: stable, no intervals fighting React. Menu + Sell live OUTSIDE React tree (body), so React never removes them.
  function isPhone(){ return window.innerWidth <= 820; }
  function findOrig(text){
    var btns = document.querySelectorAll('button, a');
    var low = text.toLowerCase();
    for(var i=0;i<btns.length;i++){
      var b = btns[i];
      if(b.id==='km-menu-fixed'||b.id==='km-sell-fixed') continue;
      var label = ((b.getAttribute('aria-label')||'')+' '+(b.title||'')+' '+(b.textContent||'')).toLowerCase();
      if(label.indexOf(low)!==-1) return b;
    }
    return null;
  }
  function buildOnce(){
    if(!isPhone()) return;
    if(!document.getElementById('km-menu-fixed')){
      var m = document.createElement('button');
      m.id='km-menu-fixed'; m.type='button'; m.setAttribute('aria-label','Open menu');
      m.innerHTML='\u2630 Menu <span class="km-menu-badge" style="display:none"></span>';
      m.onclick=function(){
        var d=document.getElementById('km-drawer-fixed');
        if(d) d.classList.toggle('km-open');
      };
      document.body.appendChild(m);
    }
    if(!document.getElementById('km-sell-fixed')){
      var s=document.createElement('button');
      s.id='km-sell-fixed'; s.type='button'; s.textContent='+ Sell';
      s.onclick=function(){ var o=findOrig('sell'); if(o) o.click(); };
      document.body.appendChild(s);
    }
    if(!document.getElementById('km-drawer-fixed')){
      var d=document.createElement('div'); d.id='km-drawer-fixed';
      var items=[
        {label:'Login', key:'login'},
        {label:'Register', key:'register'},
        {label:'Support / Help', key:'support'},
        {label:'Notifications', key:'notifications'},
        {label:'Messages', key:'messages'},
        {label:'My Shop', key:'my shop'},
        {label:'Profile', key:'profile'}
      ];
      items.forEach(function(it){
        var b=document.createElement('button'); b.type='button'; b.textContent=it.label; b.setAttribute('data-km-key', it.key);
        b.onclick=function(){
          d.classList.remove('km-open');
          var o=findOrig(it.key);
          if(o) o.click();
        };
        d.appendChild(b);
      });
      var sel=document.createElement('select'); sel.setAttribute('aria-label','Language');
      var langs=[['en','English'],['lg','Luganda'],['sw','Swahili'],['nyn','Runyankole'],['ach','Luo / Acholi'],['lus','Lusoga'],['lgb','Lugbara'],['fr','French'],['ar','Arabic'],['hi','Hindi']];
      langs.forEach(function(l){
        var op=document.createElement('option'); op.value=l[0]; op.textContent=l[1]; sel.appendChild(op);
      });
      sel.onchange=function(){
        var orig=document.querySelector('#langSelect')||document.querySelector('.lang-select');
        if(orig){
          var setter=Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype,'value').set;
          setter.call(orig, sel.value);
          orig.dispatchEvent(new Event('change',{bubbles:true}));
          orig.dispatchEvent(new Event('input',{bubbles:true}));
        }
        d.classList.remove('km-open');
      };
      d.appendChild(sel);
      document.body.appendChild(d);
    }
  }
  // Update counts only (text, no animation, no dancing) - slow, gentle
  function updateCounts(){
    try{
      if(!isPhone()) return;
      var total=0;
      document.querySelectorAll('.bell-count').forEach(function(c){
        var n=parseInt((c.textContent||'').replace(/[^0-9]/g,''),10); if(!isNaN(n)) total+=n;
      });
      var badge=document.querySelector('#km-menu-fixed .km-menu-badge');
      if(badge){
        if(total>0){ badge.style.display='inline-flex'; badge.textContent=String(total); }
        else badge.style.display='none';
      }
      var drawer=document.getElementById('km-drawer-fixed');
      if(drawer){
        drawer.querySelectorAll('button').forEach(function(b){
          var k=b.getAttribute('data-km-key')||'';
          if(k==='notifications'||k==='messages'){
            var old=b.querySelector('.km-menu-count');
            if(total>0){
              if(!old){ old=document.createElement('span'); old.className='km-menu-count'; b.appendChild(old); }
              old.textContent=String(total);
            } else if(old) old.remove();
          }
        });
      }
    }catch(e){}
  }
  function cleanup(){
    // Remove any leftover old in-header Menu button / search icon that React may have restored
    try{
      var old=document.getElementById('km-menu-btn'); if(old) old.remove();
      var ic=document.getElementById('km-search-icon'); if(ic) ic.remove();
      var pp=document.getElementById('km-search-popup'); if(pp) pp.remove();
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', function(){ buildOnce(); cleanup(); updateCounts(); });
  // Gentle: only every 3 seconds, counts only. No DOM moves, no banner touches, no dancing.
  setInterval(function(){ if(isPhone()){ buildOnce(); cleanup(); updateCounts(); } }, 3000);
  buildOnce(); cleanup(); updateCounts();
})();
</script>

<script>var KM_DEFAULT_APP_ID="7bc0b4c4-3e6a-40d2-bf9a-74a4a6b53c03";</script><script id="km-v44-email-js">
(function(){
  function getEmail(){ try{ return (localStorage.getItem('km_user_email')||'').trim(); }catch(e){ return ''; } }
  function setEmail(v){ try{ localStorage.setItem('km_user_email', v); }catch(e){} }
  function getAppId(){ try{ var v=(localStorage.getItem('km_onesignal_app_id')||'').trim(); if(v) return v; }catch(e){} return '7bc0b4c4-3e6a-40d2-bf9a-74a4a6b53c03'; }
  // Capture email securely whenever buyer types it in Register / Login / any email field
  function captureEmails(){
    try{
      document.querySelectorAll('input[type="email"]').forEach(function(inp){
        if(inp.dataset.kmEmailBound) return;
        inp.dataset.kmEmailBound = '1';
        inp.addEventListener('change', function(){
          var v = (inp.value||'').trim();
          if(v && v.indexOf('@')!==-1){ setEmail(v); syncEmailToOneSignal(); }
        });
        inp.addEventListener('blur', function(){
          var v = (inp.value||'').trim();
          if(v && v.indexOf('@')!==-1){ setEmail(v); syncEmailToOneSignal(); }
        });
      });
      // Also try to read saved user object if app stores it
      try{
        var keys = ['km_user','kampala_user','km_current_user','user'];
        keys.forEach(function(k){
          var raw = localStorage.getItem(k);
          if(raw){ var obj = JSON.parse(raw); var em = obj && (obj.email||obj.mail); if(em && em.indexOf('@')!==-1 && !getEmail()){ setEmail(em); } }
        });
      }catch(e){}
    }catch(e){}
  }
  async function syncEmailToOneSignal(){
    try{
      var em = getEmail();
      if(!em) return;
      if(!window.__kmOneSignal) return;
      var OneSignal = window.__kmOneSignal;
      try{ await OneSignal.User.addEmail(em); }catch(e){}
      try{ await OneSignal.login(em); }catch(e){}
      // V45 silent: no message box for buyer, just save + sync in background.
    }catch(e){}
  }
  function ensureEmailUI(){
    try{

        try{ sinp.value = localStorage.getItem('km_onesignal_sender_email')||''; }catch(e){}
        var sbtn = document.createElement('button');
        sbtn.type = 'button'; sbtn.textContent = 'Save Sender Email'; sbtn.style.cssText = 'background:#111;color:#fff;min-height:44px;padding:0 16px;border-radius:9px;border:0;font-size:16px;font-weight:800;cursor:pointer;';
        sbtn.onclick = function(){
          var v = (sinp.value||'').trim();
          if(!v || v.indexOf('@')===-1){ alert('Type a correct sender email first.'); return; }
          try{ localStorage.setItem('km_onesignal_sender_email', v); }catch(e){}
          alert('Sender email saved securely in this browser. Now verify the same email in OneSignal - Settings - Email, then you can send Email news.');
        };
        box.appendChild(h); box.appendChild(sinp); box.appendChild(sbtn);
      }
    }catch(e){}
  }
  function kmV44Tick(){
    captureEmails();
    ensureEmailUI();
    syncEmailToOneSignal();
  }
  document.addEventListener('DOMContentLoaded', kmV44Tick);
  setInterval(kmV44Tick, 4000);
  kmV44Tick();
})();
</script>

<script id="km-v47-send-js">
(function(){

        + '<label>Title / Subject:</label><input id="km-send-title" type="text" placeholder="e.g. New phones today on Kampala Mart" />'

        + '<div id="km-send-status"></div>'

        var t=(bells[i].textContent||"");
        if(t.indexOf("\uD83D\uDD14")>-1 || bells[i].getAttribute("aria-label")==="Notifications"){
          var ex=bells[i].querySelector(".km-v8-badge");
          if(n<=0){ if(ex) ex.remove(); continue; }
          if(!ex){ ex=document.createElement("span"); ex.className="km-v8-badge"; ex.style.cssText="position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;font-size:11px;font-weight:900;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:999px;padding:0 4px;"; bells[i].style.position="relative"; bells[i].appendChild(ex); }
          ex.textContent=n;
        }
      }
    }catch(e){}
  }
  // ---- v8: live poll - no refresh needed ----
  function poll(){
    try{
      var now=Date.now();
      if(now-LAST_POLL<5000) return;
      LAST_POLL=now;
      fetch("/api/shop").then(function(r){ return r.json(); }).then(function(cloud){
        try{
          var ch=hash(cloud);
          if(!LAST_CLOUD_HASH){ LAST_CLOUD_HASH=ch; }
          var prods=Array.isArray(cloud.products)?cloud.products:[];
          var pending=prods.filter(function(x){ return x.status==="pending_verification"||x.status==="pending"||x.status==="draft"; }).length;
          var chatCount=Array.isArray(cloud.chats)?cloud.chats.length:0;
          if(isOwnerPanelOpen() && typeof window.__kmV8LastChats!=="undefined" && chatCount>window.__kmV8LastChats){ ownerAlert("\uD83D\uDCAC New chat message - tap to open", "notifications"); }
          window.__kmV8LastChats=chatCount;
          // Owner alerts: only when Owner Panel is open, only on INCREASE (baseline on first poll)
          if(isOwnerPanelOpen()){
            if(LAST_PENDING===-1){ LAST_PENDING=pending; }
            else if(pending>LAST_PENDING){ ownerAlert("\uD83D\uDD14 "+(pending-LAST_PENDING)+" new product(s) waiting for approval", "approv"); }
            LAST_PENDING=pending;
            bellBadge(pending);
            // New live products since last poll
            if(KNOWN_IDS===null){ KNOWN_IDS={}; prods.forEach(function(x){ KNOWN_IDS[x.id]=1; }); }
            else {
              var fresh=prods.filter(function(x){ return !KNOWN_IDS[x.id]; });
              fresh.forEach(function(x){ KNOWN_IDS[x.id]=1; });
              if(fresh.length && pending===LAST_PENDING){ ownerAlert("\uD83D\uDD14 New product live: "+(fresh[0].name||fresh[0].title||"product"), "product"); }
            }
            try{ document.title=(pending>0?"("+pending+") New approval - ":"")+"Kampala Mart - Owner Panel"; }catch(e){}
          }
          // Live update: cloud changed and we are idle (no modal, not typing) -> reload to show it
          if(ch!==LAST_CLOUD_HASH && now-PAGE_START>10000 && now-LAST_RELOAD>30000){
            var typing=document.activeElement && (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName||"") || document.activeElement.isContentEditable);
            var modal=document.querySelector(".overlay, .pin-modal, .modal");
            if(!typing && !modal){
              LAST_RELOAD=now;
              LAST_CLOUD_HASH=ch;
              toast("New changes - refreshing to show them...");
              setTimeout(function(){ location.reload(); }, 1500);
            }
          }
        }catch(e){}
      }).catch(function(){});
    }catch(e){}
  }
  // ---- v8: Install App button - ALL devices (old code hid it on laptop) ----
  var deferredPrompt=null;
  window.addEventListener("beforeinstallprompt", function(e){ try{ e.preventDefault(); deferredPrompt=e; }catch(_){} });
  function addInstallBtn(){
    try{
      if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return;
      if(document.getElementById("km-v8-install-btn")) return;
      var b=document.createElement("button");
      b.id="km-v8-install-btn"; b.type="button"; b.textContent="\uD83D\uDCF1 Install App";
      b.style.cssText="position:fixed;left:12px;bottom:12px;z-index:99998;background:#111;color:#fff;border:0;border-radius:999px;padding:12px 16px;font-weight:800;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;";
      b.onclick=function(){
        if(deferredPrompt){ try{ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; try{ b.remove(); }catch(e){} }); }catch(e){} return; }
        var isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
        alert(isiOS ? "iPhone: tap Share (box with arrow) > Add to Home Screen." : "Chrome: tap the \u22EE menu (top-right) > Install Kampala Mart / Add to Home screen. On laptop the install icon also appears in the address bar.");
      };
      document.body.appendChild(b);
    }catch(e){}
  }
  setInterval(function(){
    try{
      addBtn(); rewire(); addInstallBtn(); poll();
      if(!BASELINE) return;
      var c=cur(); if(!c) return;
      var h=hash(c);
      if(h!==BASELINE && h!==LAST_SAVED){
        if((c.products&&c.products.length)||(c.banners&&c.banners.length)){ put(c, false); }
      }
    }catch(e){}
  }, 2000);
  document.addEventListener("DOMContentLoaded", function(){ addBtn(); rewire(); addInstallBtn(); });
  addBtn(); addInstallBtn();
})();
</script>
<script id="km-v8-broadcast">
(function(){
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
  function toast(msg){
    var t=document.getElementById('km-v8-toast');
    if(!t){ t=el('<div id="km-v8-toast" style="position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#111;color:#fff;padding:14px 16px;border-radius:14px;font-size:15px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;display:none"></div>'); document.body.appendChild(t); }
    t.textContent=msg; t.style.display='block';
    t.onclick=function(){ t.style.display='none'; };
    setTimeout(function(){ t.style.display='none'; }, 12000);
  }
  function seen(){ try{ return JSON.parse(localStorage.getItem('km_seen_broadcasts')||'[]'); }catch(e){ return []; } }
  function markSeen(id){ try{ var s=seen(); if(s.indexOf(id)==-1){ s.push(id); localStorage.setItem('km_seen_broadcasts', JSON.stringify(s)); } }catch(e){} }
  function isOwnerOpen(){ return !!document.querySelector('[class*="admin"], [id*="admin"]') || document.body.innerText.indexOf('Owner Panel')>-1; }
  var cover=document.getElementById('km-v8-cover');
  var isAppMode=(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || !!window.navigator.standalone;
  if(!cover && isAppMode){ cover=el('<div id="km-v8-cover" style="position:fixed;inset:0;z-index:9998;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:sans-serif"><div style="font-size:22px;font-weight:800">Kampala Mart</div><div style="color:#666">Loading your shop...</div></div>'); document.body.appendChild(cover); }
  function hideCover(){ if(cover) cover.style.display='none'; }
  var coverChecks=0;
  var coverTimer=setInterval(function(){ coverChecks++;
    var hasCards=document.querySelector('[class*="product"], [class*="card"]');
    var shop=window.__kmLatestShop;
    if((shop&&Array.isArray(shop.products)&&shop.products.length>0)||hasCards||coverChecks>10){ hideCover(); clearInterval(coverTimer); }
  }, 400);
  setTimeout(hideCover, 6000);
  setTimeout(function(){
    try{
      if(cover && cover.style.display!=='none' && !document.getElementById('km-v8-retry-btn')){
        var msg=document.createElement('div'); msg.style.cssText='color:#555;font-size:14px;max-width:280px;text-align:center;line-height:1.4';
        msg.textContent='The shop is taking long to wake up. This happens on first open. Tap below to try again.';
        var rb=document.createElement('button'); rb.id='km-v8-retry-btn'; rb.type='button';
        rb.textContent='Tap to retry'; rb.style.cssText='margin-top:14px;background:#111;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-weight:800;font-size:16px;cursor:pointer';
        rb.onclick=function(){ location.reload(); };
        cover.appendChild(msg); cover.appendChild(rb);
      }
    }catch(e){}
  }, 8000);
  
  function injectOwnerTools(){
    try{
      if(!isOwnerOpen()) return;
      if(!document.getElementById('km-v8-broadcast-box')){
        var heads=[].slice.call(document.querySelectorAll('h1,h2,h3,h4'));
        var anchor=heads.find(function(h){ return /notifications/i.test(h.textContent); })||heads[0];
        if(anchor){
          var box=el('<div id="km-v8-broadcast-box" style="margin:12px 0;padding:14px;border:2px solid #111;border-radius:14px;background:#fff"><div style="font-weight:800;font-size:16px;margin-bottom:6px">Send notification to ALL users (phone + web)</div><div style="font-size:13px;color:#555;margin-bottom:8px">Everyone sees this in the app instantly, even without refresh.</div><textarea id="km-v8-broadcast-text" rows="2" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;font-size:15px" placeholder="e.g. New phones just arrived! Open Kampala Mart now."></textarea><button id="km-v8-broadcast-send" style="margin-top:8px;width:100%;background:#111;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:800;font-size:15px">Send to everyone</button><div id="km-v8-broadcast-status" style="font-size:13px;margin-top:6px;color:#0a7"></div></div>');
          anchor.parentNode.insertBefore(box, anchor.nextSibling);
          box.querySelector('#km-v8-broadcast-send').onclick=function(){
            var txt=box.querySelector('#km-v8-broadcast-text').value.trim();
            if(!txt){ box.querySelector('#km-v8-broadcast-status').textContent='Type a message first.'; return; }
            fetch('/api/shop').then(function(r){ return r.json(); }).then(function(cloud){
              var arr=Array.isArray(cloud.broadcasts)?cloud.broadcasts:[];
              arr.push({id:'b-'+Date.now(), text:txt, at:new Date().toISOString()});
              cloud.broadcasts=arr.slice(-20);
              return fetch('/api/shop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cloud)});
            }).then(function(){ box.querySelector('#km-v8-broadcast-status').textContent='Sent! Every user will see it.'; box.querySelector('#km-v8-broadcast-text').value=''; })
            .catch(function(){ box.querySelector('#km-v8-broadcast-status').textContent='Could not send. Try again.'; });
          };
        }
      }
      if(!document.getElementById('km-v8-undo-btn')){
        var saveBtns=[].slice.call(document.querySelectorAll('button')).filter(function(b){ return /save/i.test(b.textContent); });
        if(saveBtns.length){
          var ub=el('<button id="km-v8-undo-btn" style="margin:8px 0;padding:10px 14px;border:2px solid #111;background:#fff;border-radius:10px;font-weight:800;cursor:pointer">Undo last change</button>');
          saveBtns[0].parentNode.insertBefore(ub, saveBtns[0].nextSibling);
          ub.onclick=function(){
            try{
              var stack=JSON.parse(localStorage.getItem('km_undo_stack')||'[]');
              if(!stack.length){ toast('Nothing to undo.'); return; }
              var prev=stack[stack.length-1];
              if(!confirm('Undo the last change? The shop will go back to how it was before it.')) return;
              fetch('/api/shop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(prev)}).then(function(){ localStorage.setItem('km_undo_stack', JSON.stringify(stack.slice(0,-1))); toast('Undone. Refreshing...'); setTimeout(function(){ location.reload(); }, 800); });
            }catch(e){ toast('Could not undo.'); }
          };
        }
      }
      if(!document.getElementById('km-v8-empty-btn-el')){
        var saveBtns2=[].slice.call(document.querySelectorAll('button')).filter(function(b){ return /save/i.test(b.textContent); });
        if(saveBtns2.length){
          var eb=el('<button id="km-v8-empty-btn-el" style="margin:8px 0;padding:10px 14px;border:2px solid #c00;background:#fff;color:#c00;border-radius:10px;font-weight:800;cursor:pointer;display:block">Empty the shop (delete ALL products)</button>');
          saveBtns2[0].parentNode.insertBefore(eb, saveBtns2[0].nextSibling);
          eb.onclick=function(){
            if(!confirm('Delete ALL products? Users, settings and fees collected will STAY. You can undo this with Undo last change.')) return;
            fetch('/api/shop').then(function(r){ return r.json(); }).then(function(cloud){
              cloud.products=[]; cloud.allowEmpty=true;
              return fetch('/api/shop',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(cloud)});
            }).then(function(){ alert('Shop is now empty. Sellers can upload fresh products.'); location.reload(); })
            .catch(function(){ alert('Could not empty the shop. Try again.'); });
          };
        }
      }
    }catch(e){}
  }
  setInterval(injectOwnerTools, 3000);
  var _origFetch=window.fetch;
  window.fetch=function(url, opts){
    try{
      if(typeof url==='string' && url.indexOf('/api/shop')>-1 && opts && opts.method==='PUT' && opts.body){
        _origFetch('/api/shop').then(function(r){ return r.json(); }).then(function(cloud){
          try{ var stack=JSON.parse(localStorage.getItem('km_undo_stack')||'[]'); stack.push(cloud); localStorage.setItem('km_undo_stack', JSON.stringify(stack.slice(-10))); }catch(e){}
        }).catch(function(){});
      }
    }catch(e){}
    return _origFetch.apply(this, arguments);
  };
  var lastChatCount=-1;
  setInterval(function(){
    fetch('/api/shop').then(function(r){ return r.json(); }).then(function(cloud){
      var cc=Array.isArray(cloud.chats)?cloud.chats.length:0;
      if(lastChatCount!==-1 && cc>lastChatCount){ toast('New chat message - tap Refresh if you do not see it'); try{ if(Notification.permission==='granted'){ new Notification('Kampala Mart', {body:'You have a new chat message'}); } }catch(e){} }
      lastChatCount=cc;
      var arr=Array.isArray(cloud.broadcasts)?cloud.broadcasts:[];
      arr.forEach(function(b){
        if(b&&b.id&&seen().indexOf(b.id)==-1){
          markSeen(b.id);
          toast('Kampala Mart: '+b.text);
          try{ if(Notification.permission==='granted'){ new Notification('Kampala Mart', {body:b.text}); } }catch(e){}
        }
      });
    }).catch(function(){});
  }, 8000);
  })();
</script>

<style id="km-v85-ptr">html,body{overscroll-behavior-y:auto}body{touch-action:pan-y}</style>
<script id="km-v88-watchdog">
(function(){
  window.__kmErr='';
  window.addEventListener('error', function(e){ try{ if(!window.__kmErr) window.__kmErr=(e.message||'Script error')+' @ '+(e.filename||'').split('/').pop()+':'+(e.lineno||''); }catch(_){} }, true);
  function shopText(){ try{ var c=document.body.cloneNode(true); var p=c.querySelector('#km-v88-diag'); if(p) p.remove(); var t=(c.innerText||'').replace(/\s+/g,' ').trim(); return t; }catch(_){ return 'x'.repeat(999); } }
  function showPanel(){
    if(document.getElementById('km-v88-diag')) return;
    var err=window.__kmErr || 'No error shown - the shop data never arrived. This usually means the server was still waking up.';
    var d=document.createElement('div'); d.id='km-v88-diag';
    d.style.cssText='position:fixed;inset:0;z-index:100000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;font-family:sans-serif;text-align:center';
    d.innerHTML='<div style="font-size:22px;font-weight:800">Shop did not open</div><div style="color:#555;font-size:14px;max-width:340px;line-height:1.5">What went wrong:<br><b id="km-v88-err"></b></div><button id="km-v88-retry" style="background:#111;color:#fff;border:0;border-radius:12px;padding:14px 26px;font-weight:800;font-size:16px;cursor:pointer">Tap to retry</button><button id="km-v88-clear" style="background:#fff;color:#111;border:2px solid #111;border-radius:12px;padding:12px 22px;font-weight:800;font-size:15px;cursor:pointer">Clear saved app data &amp; retry</button><button id="km-v88-close" style="background:none;border:0;color:#888;font-size:14px;cursor:pointer;text-decoration:underline">Close this message</button><div style="color:#999;font-size:12px">If it keeps happening, screenshot this screen and send it.</div>';
    document.body.appendChild(d);
    d.querySelector('#km-v88-err').textContent=err;
    d.querySelector('#km-v88-retry').onclick=function(){ location.reload(); };
    d.querySelector('#km-v88-close').onclick=function(){ d.remove(); };
    d.querySelector('#km-v88-clear').onclick=function(){
      try{
        var jobs=[];
        if('caches' in window){ jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }
        if('serviceWorker' in navigator){ jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }
        Promise.all(jobs).then(function(){ location.reload(); }).catch(function(){ location.reload(); });
      }catch(_){ location.reload(); }
    };
  }
  function check(){
    if(document.getElementById('km-sw-fallback')) return;
    if(document.getElementById('km-v88-diag')){
      if(shopText().length>150){ var p=document.getElementById('km-v88-diag'); if(p) p.remove(); }
      return;
    }
    if(shopText().length<80){ showPanel(); }
  }
  setTimeout(function(){ check(); setInterval(check, 5000); }, 15000);
})();
</script>
